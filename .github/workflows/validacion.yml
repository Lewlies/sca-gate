# Pruebas unitarias de sca-gate. La validacion sobre datos no usados en el diseno esta en holdout.yml.
name: validacion

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest -v test_sca_gate.py
